<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorControl — Admin Users Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #090d16; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .badge-id { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    </style>
</head>
<body class="text-slate-200 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Шапка панели -->
        <header class="glass-panel p-5 rounded-2xl flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-purple-600/20 border border-purple-500/40 flex items-center justify-center text-purple-400 font-black text-xl">
                    ⚡
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">TutorControl Admin</h1>
                    <p class="text-xs text-slate-400">Управление пользователями и правами доступa</p>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="loadUsersList()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl transition">🔄 Обновить базу</button>
            </div>
        </header>

        <!-- Поиск пользователя по ID -->
        <div class="glass-panel p-4 rounded-2xl flex gap-3 items-center">
            <span class="text-xs text-slate-400 font-bold uppercase tracking-wider pl-2">Быстрый переход по ID:</span>
            <input type="number" id="searchUserId" placeholder="Например: 1" class="bg-slate-950 border border-slate-800 px-3 py-2 rounded-xl text-sm focus:outline-none focus:border-purple-500 w-36">
            <button onclick="fetchSingleUser()" class="bg-purple-600 hover:bg-purple-500 text-xs font-bold px-4 py-2.5 rounded-xl transition">Открыть профиль</button>
        </div>

        <!-- Полноформатная карточка редактирования (Аналог /account/admin/users/{id}) -->
        <div id="singleUserCard" class="glass-panel p-6 rounded-2xl space-y-6 hidden">
            <div class="flex justify-between items-start border-b border-slate-800 pb-4">
                <div>
                    <span id="cardUserBadge" class="badge-id px-3 py-1 rounded-full text-xs font-bold">ID: #--</span>
                    <h2 id="cardUsername" class="text-2xl font-black text-white mt-2">Username</h2>
                </div>
                <button onclick="closeCard()" class="text-slate-500 hover:text-white font-bold text-sm">✕ Закрыть</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase">Системная роль</label>
                    <select id="cardRole" class="w-full mt-1.5 p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm font-semibold focus:border-purple-500">
                        <option value="guest">Гость (guest)</option>
                        <option value="student">Ученик (student)</option>
                        <option value="teacher">Преподаватель (teacher)</option>
                        <option value="admin">Администратор (admin)</option>
                    </select>
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase">Тарифный план</label>
                    <select id="cardTariff" class="w-full mt-1.5 p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm font-semibold focus:border-purple-500">
                        <option value="Не выбран">Не выбран</option>
                        <option value="Базовый (35 BYN)">Базовый (35 BYN)</option>
                        <option value="Продвинутый (80 BYN)">Продвинутый (80 BYN)</option>
                        <option value="VIP (150 BYN)">VIP (150 BYN)</option>
                    </select>
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase">Статус аккаунта</label>
                    <select id="cardStatus" class="w-full mt-1.5 p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm font-semibold focus:border-purple-500">
                        <option value="Активен">Активен</option>
                        <option value="Заблокирован">Заблокирован</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase">Назначенный репетитор</label>
                    <input type="text" id="cardTeacher" placeholder="ФИО репетитора" class="w-full mt-1.5 p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase">Ссылка на онлайн-урок (Zoom/Teams)</label>
                    <input type="text" id="cardLink" placeholder="https://..." class="w-full mt-1.5 p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm">
                </div>
            </div>

            <div class="flex gap-3 pt-2">
                <button onclick="saveCardData()" class="flex-1 bg-purple-600 hover:bg-purple-500 font-bold py-3 rounded-xl transition text-sm">Сохранить изменения</button>
                <button onclick="deleteCardUser()" class="bg-red-950/60 hover:bg-red-900 border border-red-500/30 text-red-300 font-bold px-5 py-3 rounded-xl transition text-sm">Удалить</button>
            </div>
        </div>

        <!-- Таблица всех пользователей -->
        <div class="glass-panel p-6 rounded-2xl space-y-4">
            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Все пользователи системы</h3>
            <div id="usersTable" class="space-y-3"></div>
        </div>

    </div>

    <script>
        const API_URL = "https://site-34ib.onrender.com"; // Ваш Render бэкенд
        let currentEditId = null;

        async function loadUsersList() {
            try {
                let res = await fetch(`${API_URL}/api/admin/users`);
                let users = await res.json();
                let html = "";
                users.forEach(u => {
                    html += `
                    <div class="p-4 bg-slate-950/60 rounded-xl border border-slate-800/80 flex flex-wrap justify-between items-center gap-4 hover:border-purple-500/40 transition">
                        <div class="flex items-center gap-3">
                            <span class="badge-id px-2.5 py-1 rounded-lg text-xs font-bold">#${u.user_id}</span>
                            <div>
                                <h4 class="font-bold text-sm text-white">${u.username}</h4>
                                <span class="text-xs text-slate-400">Роль: <b class="text-purple-400">${u.role}</b> | Тариф: ${u.tariff}</span>
                            </div>
                        </div>
                        <button onclick="openUserCard(${u.user_id})" class="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-4 py-2 rounded-lg transition">Управлять (#${u.user_id})</button>
                    </div>`;
                });
                document.getElementById('usersTable').innerHTML = html || "<p class='text-slate-500 text-sm'>Пользователи не найдены.</p>";
            } catch (err) {
                alert("Ошибка загрузки пользователей");
            }
        }

        async function openUserCard(id) {
            let res = await fetch(`${API_URL}/api/admin/user/${id}`);
            if(!res.ok) return alert("Пользователь не найден!");
            let u = await res.json();
            
            currentEditId = u.user_id;
            document.getElementById('cardUserBadge').innerText = `ID: #${u.user_id}`;
            document.getElementById('cardUsername').innerText = u.username;
            document.getElementById('cardRole').value = u.role;
            document.getElementById('cardTariff').value = u.tariff;
            document.getElementById('cardStatus').value = u.status;
            document.getElementById('cardTeacher').value = u.teacher_name || '';
            document.getElementById('cardLink').value = u.lesson_link || '';

            document.getElementById('singleUserCard').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function fetchSingleUser() {
            let id = document.getElementById('searchUserId').value;
            if(id) openUserCard(id);
        }

        function closeCard() {
            document.getElementById('singleUserCard').classList.add('hidden');
            currentEditId = null;
        }

        async function saveCardData() {
            if(!currentEditId) return;
            let role = document.getElementById('cardRole').value;
            let tariff = document.getElementById('cardTariff').value;
            let status = document.getElementById('cardStatus').value;
            let teacher_name = document.getElementById('cardTeacher').value;
            let lesson_link = document.getElementById('cardLink').value;

            let res = await fetch(`${API_URL}/api/admin/user/${currentEditId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({role, tariff, status, teacher_name, lesson_link})
            });
            let json = await res.json();
            alert(json.message);
            loadUsersList();
        }

        async function deleteCardUser() {
            if(!currentEditId || !confirm(`Удалить пользователя #${currentEditId}?`)) return;
            let res = await fetch(`${API_URL}/api/admin/user/${currentEditId}`, { method: 'DELETE' });
            let json = await res.json();
            alert(json.message);
            closeCard();
            loadUsersList();
        }

        window.onload = loadUsersList;
    </script>
</body>
</html>

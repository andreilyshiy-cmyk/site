<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Образовательный Центр Репетиторов</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-p-6">

    <header class="max-w-4xl mx-auto p-4 flex justify-between items-center border-b border-slate-800">
        <h1 class="text-xl font-bold text-blue-400">📚 Репетиторский Штаб</h1>
        <div class="space-x-4">
            <a href="#tariffs" class="hover:text-blue-400">Тарифы</a>
            <a href="#staff" class="hover:text-blue-400">Преподаватели</a>
            <a href="#hw" class="hover:text-blue-400">Домашние задания</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-12">
        
        <!-- Герой-секция и Заявка -->
        <section class="text-center py-10 bg-slate-800 rounded-2xl shadow-xl p-6">
            <h2 class="text-3xl font-extrabold mb-4">Подготовка к экзаменам и учеба с экспертами</h2>
            <p class="text-slate-400 mb-6">Подайте заявку на обучение прямо сейчас, и мы подберем вам индивидуальный план.</p>
            
            <div class="max-w-md mx-auto space-y-4 text-left">
                <input type="text" id="reqName" placeholder="Ваше имя" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl">
                <input type="text" id="reqContact" placeholder="Телефон или Telegram" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl">
                <select id="reqTariff" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl">
                    <option value="Базовый (10$/мес)">Тариф: Базовый ($10/мес)</option>
                    <option value="Продвинутый (25$/мес)">Тариф: Продвинутый ($25/мес)</option>
                    <option value="VIP с репетитором (50$/мес)">Тариф: VIP с репетитором ($50/мес)</option>
                </select>
                <button onclick="sendRequest()" class="w-full bg-blue-600 hover:bg-blue-500 font-bold p-3 rounded-xl">Подать заявку</button>
            </div>
        </section>

        <!-- Штаб работников -->
        <section id="staff">
            <h3 class="text-2xl font-bold mb-4">👥 Наш преподавательский штаб</h3>
            <div id="staffGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Динамически загружается -->
            </div>
        </section>

        <!-- Домашние задания -->
        <section id="hw" class="bg-slate-800 p-6 rounded-2xl">
            <h3 class="text-2xl font-bold mb-4">📖 Актуальные домашние задания</h3>
            <div id="hwContainer" class="space-y-4">
                <!-- Динамически загружается -->
            </div>
        </section>

        <div id="messageBox" class="hidden p-4 rounded-xl text-center font-bold"></div>
    </main>

    <script>
        const API_URL = "https://tutor-backend.onrender.com"; // Замените на вашу ссылку с Render

        function showMsg(text, isError = false) {
            const box = document.getElementById('messageBox');
            box.classList.remove('hidden', 'bg-emerald-900', 'bg-red-900');
            box.classList.add(isError ? 'bg-red-900' : 'bg-emerald-900');
            box.innerText = text;
        }

        async function sendRequest() {
            const data = {
                student_name: document.getElementById('reqName').value,
                contact: document.getElementById('reqContact').value,
                tariff: document.getElementById('reqTariff').value
            };
            try {
                let res = await fetch(`${API_URL}/api/request`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                let json = await res.json();
                showMsg(json.message);
            } catch(e) { showMsg("Ошибка отправки заявки", true); }
        }

        async function loadStaff() {
            let res = await fetch(`${API_URL}/api/staff`);
            let staff = await res.json();
            let html = "";
            staff.forEach(s => {
                html += `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
                    <img src="${s.photo_url}" class="w-24 h-24 mx-auto rounded-full object-cover mb-3">
                    <h4 class="font-bold text-lg">${s.name}</h4>
                    <p class="text-xs text-blue-400">${s.role_title}</p>
                </div>`;
            });
            document.getElementById('staffGrid').innerHTML = html || "<p class='text-slate-400'>Штаб пустой</p>";
        }

        async function loadHw() {
            let res = await fetch(`${API_URL}/api/homeworks`);
            let hws = await res.json();
            let html = "";
            hws.forEach(h => {
                html += `<div class="p-4 bg-slate-900 rounded-xl border border-slate-700">
                    <span class="text-xs bg-blue-900 text-blue-300 px-2 py-1 rounded">${h.subject}</span>
                    <h4 class="font-bold text-lg mt-2">${h.title}</h4>
                    <p class="text-slate-400 text-sm mt-1">${h.description}</p>
                </div>`;
            });
            document.getElementById('hwContainer').innerHTML = html || "<p class='text-slate-400'>Нет заданий</p>";
        }

        window.onload = () => {
            loadStaff();
            loadHw();
        }
    </script>
</body>
</html>
